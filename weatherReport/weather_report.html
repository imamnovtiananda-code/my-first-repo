<!DOCTYPE html>
<html>
<head>
    <title>Weather Report</title>
</head>
<body>
    <h1>Weather Report</h1>
    
    <!-- Form Utama: Pencarian berdasarkan Nama Kota -->
    <form id="weatherForm">
        <label for="city">Enter City: </label>
        <input type="text" id="city" name="city">
        <button type="submit">Get Weather</button>
    </form>
    <div id="weatherInfo"></div>

    <hr>

    <!-- Practice Task: Pencarian berdasarkan Latitude dan Longitude -->
    <h2>Get Weather by Coordinates</h2>
    <form id="latLonForm">
        <label for="latitude">Latitude: </label>
        <input type="text" id="latitude" name="latitude">
        <br><br>
        <label for="longitude">Longitude: </label>
        <input type="text" id="longitude" name="longitude">
        <br><br>
        <button type="submit">Get Weather by Coordinates</button>
    </form>
    <div id="latLonWeatherInfo"></div>

    <script src="./weather_report.js"></script>
</body>
</html>
