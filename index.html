<script>
    function searchRecommendation() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const results = document.getElementById('results');
        
        if (input.includes('beach') || input.includes('pantai')) {
            results.innerHTML = `
                <div style="display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap;">
                    <div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px; width: 250px; background: #fff;">
                        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400" alt="Bora Bora" style="width: 100%; height: 150px; object-fit: cover; border-radius: 6px;">
                        <h3 style="margin-top: 10px;">Bora Bora</h3>
                        <p>Pantai indah dengan air laut jernih dan pemandangan luar biasa.</p>
                    </div>
                    <div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px; width: 250px; background: #fff;">
                        <img src="https://images.unsplash.com/photo-1519046904884-53103b34b206?w=400" alt="Copacabana" style="width: 100%; height: 150px; object-fit: cover; border-radius: 6px;">
                        <h3 style="margin-top: 10px;">Copacabana</h3>
                        <p>Pantai terkenal di Rio de Janeiro dengan suasana yang meriah.</p>
                    </div>
                </div>
            `;
        } else if (input.trim() === "") {
            results.innerHTML = "<p>Silakan masukkan kata kunci pencarian.</p>";
        } else {
            results.innerHTML = `<p>Tidak ditemukan rekomendasi untuk <strong>${input}</strong>.</p>`;
        }
    }
</script>
