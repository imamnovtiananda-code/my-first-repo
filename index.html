<script>
    function searchRecommendation() {
        const inputField = document.getElementById('searchInput');
        const input = inputField.value.trim().toLowerCase();
        const results = document.getElementById('results');
        
        results.innerHTML = '';

        if (input.includes('country') || input.includes('negara')) {
            results.innerHTML = `
                <p>Hasil pencarian untuk: <strong>${input}</strong></p>
                <div class="card-grid">
                    <div class="card">
                        <img src="https://picsum.photos/id/1029/400/250" alt="Japan">
                        <h3>Jepang (Japan)</h3>
                        <p>Negara dengan perpaduan budaya tradisional dan modernitas teknologi yang menakjubkan.</p>
                    </div>
                    <div class="card">
                        <img src="https://picsum.photos/id/1047/400/250" alt="Australia">
                        <h3>Australia</h3>
                        <p>Negara benua dengan keindahan alam luar biasa, pantai eksotis, dan keanekaragaman hayati.</p>
                    </div>
                </div>
            `;
        } else if (input.includes('temple') || input.includes('candi')) {
            results.innerHTML = `
                <p>Hasil pencarian untuk: <strong>${input}</strong></p>
                <div class="card-grid">
                    <div class="card">
                        <img src="https://picsum.photos/id/1040/400/250" alt="Candi Borobudur">
                        <h3>Candi Borobudur</h3>
                        <p>Candi Buddha terbesar di dunia yang terletak di Magelang, Indonesia.</p>
                    </div>
                    <div class="card">
                        <img src="https://picsum.photos/id/1043/400/250" alt="Angkor Wat">
                        <h3>Angkor Wat</h3>
                        <p>Kompleks candi Hindu-Buddha kuno yang luas di Kamboja.</p>
                    </div>
                </div>
            `;
        } else if (input.includes('beach') || input.includes('pantai')) {
            results.innerHTML = `
                <p>Hasil pencarian untuk: <strong>${input}</strong></p>
                <div class="card-grid">
                    <div class="card">
                        <img src="https://picsum.photos/id/1015/400/250" alt="Bora Bora Beach">
                        <h3>Bora Bora Beach</h3>
                        <p>Pantai indah dengan air laut jernih dan pemandangan luar biasa di Polynesia Prancis.</p>
                    </div>
                    <div class="card">
                        <img src="https://picsum.photos/id/1039/400/250" alt="Copacabana Beach">
                        <h3>Copacabana Beach</h3>
                        <p>Pantai terkenal di Rio de Janeiro dengan pasir putih dan suasana meriah.</p>
                    </div>
                </div>
            `;
        } else if (input === "") {
            results.innerHTML = "<p>Silakan masukkan kata kunci pencarian (contoh: <strong>country</strong>, <strong>temple</strong>, atau <strong>beach</strong>).</p>";
        } else {
            results.innerHTML = `<p>Tidak ditemukan rekomendasi untuk <strong>${input}</strong>.</p>`;
        }
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        document.getElementById('results').innerHTML = '';
    }
</script>
